<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;color:#1b1d22;background:#f6f7f9}
.q4top{height:52px;background:#fff;border-bottom:1px solid #e3e5ea;display:flex;align-items:center;padding:0 20px;gap:12px}
.q4top b{font-size:15px}.q4mut{color:#6a6f7a}.q4cap{font-size:12px;color:#6a6f7a}
.q4wrap{display:flex;height:calc(100vh - 52px)}
.q4canvas{flex:1;padding:40px;display:flex;flex-direction:column;align-items:center;gap:18px;background-image:radial-gradient(#d9dce2 1px,transparent 1px);background-size:18px 18px}
.q4card{width:300px;background:#fff;border:1px solid #d9dce2;border-radius:8px;padding:10px 14px}
.q4grp{width:360px;border:1.5px dashed #9aa1ad;border-radius:10px;padding:12px;background:#ffffffcc}
.q4grp.q4sel{border:2px solid #3b5bdb;background:#eef2ff99}
.q4chip{display:inline-block;font-size:12px;background:#eef0f4;border-radius:10px;padding:1px 8px;color:#454a55;margin-left:6px}
.q4panel{width:380px;background:#fff;border-left:1px solid #e3e5ea;display:flex;flex-direction:column}
.q4ph{padding:16px 20px;border-bottom:1px solid #e3e5ea;font-weight:600;font-size:15px}
.q4pb{padding:16px 20px;flex:1;display:flex;flex-direction:column;gap:14px;overflow:auto}
.q4pf{padding:12px 20px;border-top:1px solid #e3e5ea}
.q4h{font-weight:600;font-size:13px;margin-top:4px}
.q4f label{display:block;font-weight:500;margin-bottom:4px}
.q4f input{width:96px;height:34px;border:1px solid #c9cdd5;border-radius:6px;padding:0 10px;font:inherit}
.q4f.q4bad input{border-color:#c92a2a;box-shadow:0 0 0 2px #ffe3e3}
.q4hint{font-size:12.5px;color:#6a6f7a;margin-top:4px}
.q4err{font-size:12.5px;color:#c92a2a;margin-top:4px}
.q4btn{height:34px;border-radius:6px;border:1px solid #c9cdd5;background:#fff;padding:0 14px;font:inherit;font-weight:500}
.q4pri{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
.q4tip{display:inline-flex;width:16px;height:16px;border-radius:50%;border:1px solid #9aa1ad;font-size:11px;align-items:center;justify-content:center;color:#6a6f7a;margin-left:4px}
.q4now{width:760px;background:#fff;border:1px solid #e3e5ea;border-radius:10px;padding:20px 24px;margin:40px auto}
.q4now h3{margin:0 0 6px;font-size:17px}.q4pill{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:#fff4e6;color:#a1520c;font-weight:600;margin-bottom:10px}
</style></head><body><div class="q4top"><b>Task · Add CSV export</b></div><div style="position:fixed;inset:52px 0 0;background:#0006;display:flex;align-items:center;justify-content:center"><div style="width:440px;background:#fff;border-radius:10px;padding:20px 24px;display:flex;flex-direction:column;gap:14px"><b style="font-size:16px">Allow more tries?</b><div>Bakery tried 2 times and paused. It tries again up to the number you choose, then stops if it still cannot fix this. Your name is recorded on this task.</div><div class="q4f"><label>More tries</label><input value="2"><div class="q4hint">From 1 to 2.</div></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="q4btn">Cancel</button><button class="q4btn q4pri">Allow more tries</button></div></div></div></body></html>
