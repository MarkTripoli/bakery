<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bakery brand review</title>
    <link rel="stylesheet" href="/gallery.css">
  </head>
  <body>
    <header class="bar">
      <div class="bar-title">
        <h1>Bakery brand review</h1>
        <span id="updated" class="muted">Loading…</span>
      </div>
      <nav
        class="jump"><a href="#logo-system">Logo system</a><a href="#legibility">Legibility</a></nav>
      <div class="controls">
        <div class="segmented" id="bg-toggle" role="group"
          aria-label="Tile surface"></div>
        <div class="segmented" id="filter-toggle" role="group"
          aria-label="Filter">
          <button type="button" data-filter="all">All</button>
          <button type="button" data-filter="picks">Picks only</button>
        </div>
      </div>
    </header>

    <main id="root"></main>

    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true"
      aria-label="Image viewer">
      <button type="button" class="lb-btn lb-close" id="lb-close"
        aria-label="Close">✕</button>
      <button type="button" class="lb-btn lb-prev" id="lb-prev"
        aria-label="Previous">‹</button>
      <button type="button" class="lb-btn lb-next" id="lb-next"
        aria-label="Next">›</button>
      <figure class="lb-figure">
        <div class="lb-stage"><img id="lb-img" alt=""></div>
        <figcaption id="lb-info" class="lb-info"></figcaption>
      </figure>
    </div>

    <script src="/gallery.js"></script>
  </body>
</html>
