<!doctype html><html lang="en"><head><meta charset="utf-8"><title>#81</title><style>
/* Values copied from packages/ui/src/foundations/tokens.css and theme.css (light). */
:root{
  --color-border:#E3E6EB;--color-border-strong:#CBD0D8;--color-canvas:#F5F6F8;--color-control-border:#8A939F;
  --color-destructive:#BE3341;--color-destructive-surface:#FCEEEF;--color-fg:#141A24;--color-fg-muted:#5D6675;
  --color-fg-disabled:#9AA3B1;--color-focus:#0B63C6;--color-primary:#141A24;--color-primary-foreground:#FFFFFF;
  --color-selection:#0B63C6;--color-selection-surface:#ECF1F8;--color-status-neutral:#374151;
  --color-status-neutral-surface:#E5E7EB;--color-status-success:#17784B;--color-status-success-surface:#E8F5EE;
  --color-status-warning:#8F5A0B;--color-status-warning-surface:#FBF3E4;--color-surface:#FFFFFF;
  --color-surface-subtle:#EEF0F4;
  --font-sans:Geist,system-ui,sans-serif;--font-mono:"Geist Mono",ui-monospace,monospace;
  --radius-control:4px;--radius-surface:6px;--radius-overlay:8px;--radius-pill:999px;
  --size-control:36px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;
  --type-body:400 14px/20px var(--font-sans);--type-caption:400 12px/18px var(--font-sans);
  --type-control:500 14px/20px var(--font-sans);--type-data:400 13px/20px var(--font-mono);
  --type-heading-page:600 24px/32px var(--font-sans);--type-field:400 16px/24px var(--font-sans);
  --shadow-overlay:0 8px 24px rgba(20,26,36,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-surface);font:var(--type-body);color:var(--color-fg);width:1440px;height:900px;display:flex}
h1{font:var(--type-heading-page);letter-spacing:-.02em;margin:0}p{margin:0}.muted{color:var(--color-fg-muted)}.cap{font:var(--type-caption);color:var(--color-fg-muted)}
.side{width:220px;border-right:1px solid var(--color-border);background:var(--color-canvas);padding:16px 12px;display:flex;flex-direction:column;gap:4px;flex:none}.side b{font-weight:600;padding:6px 8px 12px}.side span{padding:7px 8px;color:var(--color-fg-muted)}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.main img{width:240px;height:auto}.ph .main img{width:160px}.main p{max-width:420px}
.btn{font:var(--type-control);height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--color-primary);background:var(--color-primary);color:var(--color-surface);display:inline-flex;align-items:center}.ph .btn{height:44px}
.btn.sec{background:transparent;color:var(--color-fg);border-color:var(--color-border-strong)}
.row{display:flex;gap:8px}
.top{height:52px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 16px;font:600 18px/24px var(--font-sans);align-self:stretch;flex:none}</style></head><body class=""><div class="side"><b>Acme Films</b><span>Work</span><span>Issues</span><span>Projects</span><span>Library</span><span>Machines</span><span>Settings</span></div><div class="main"><img alt="" src="not-found-light-600.webp"><h1>Page not found</h1><p class="muted">The requested Bakery page does not exist.</p><div class="row"><span class="btn">Go to Work</span><span class="btn sec">Go back</span></div></div></body></html>
