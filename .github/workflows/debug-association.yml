name: Debug association
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  echo:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Print the identity and API views
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ASSOC: ${{ github.event.pull_request.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "payload assoc=$PR_ASSOC head_repo=$HEAD_REPO repo=$GITHUB_REPOSITORY"
          echo "rest pr assoc: $(gh api repos/$GITHUB_REPOSITORY/pulls/$PR --jq .author_association 2>&1)"
          echo "collab permission: $(gh api repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission --jq .permission 2>&1)"
          echo "collab check: $(gh api -i repos/$GITHUB_REPOSITORY/collaborators/$ACTOR 2>&1 | head -1)"
          echo "org member: $(gh api -i orgs/MarkTripoli/members/$ACTOR 2>&1 | head -1)"
