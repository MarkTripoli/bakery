name: Debug association
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  echo:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Print the event identity fields
        env:
          PR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          ACTOR: ${{ github.actor }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          REPO_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
        run: |
          echo "pr.author_association=$PR_ASSOC"
          echo "pr.user=$PR_USER type=$PR_USER_TYPE"
          echo "actor=$ACTOR sender=$SENDER type=$SENDER_TYPE"
          echo "repo owner=$REPO_OWNER type=$REPO_OWNER_TYPE"
