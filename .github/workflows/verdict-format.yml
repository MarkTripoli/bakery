name: Verdict format

# Review and QA verdicts must stay short (see .github/AUTHORING.md). A PR
# comment or review whose first line starts with "Verdict:" is checked with the
# trusted base-branch validator, and the result is posted as a commit status on
# the PR head so it shows on the PR. The comment body is passed as data on
# stdin, never interpolated into a shell command.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions: {}

jobs:
  verdict:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, 'Verdict:')) ||
      (github.event_name == 'pull_request_review' &&
       startsWith(github.event.review.body, 'Verdict:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.1
      - name: Check the verdict and report it on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          URL: ${{ github.event.comment.html_url || github.event.review.html_url }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if result=$(printf '%s' "$BODY" | deno run --no-config --allow-read=scripts/authoring scripts/authoring/validate.ts review -); then
            state=success; text="Verdict is short and well formed."
          else
            state=failure; text=$(printf '%s' "$result" | jq -r '.errors | join(" ")' | cut -c1-140)
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$state" \
            -f context="Verdict format" -f description="$text" -f target_url="$URL" >/dev/null
          echo "$state: $text"
          [ "$state" = success ]
