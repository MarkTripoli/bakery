# TEMPORARY (#330): runs the real steps of the CI jobs that never run on a pull request gate
# (ui_architecture, docs_validation) and of the description policy's pull-request job on a hosted
# runner, so their first hosted run is not on main. Removed before review.
name: 'Hosted probe (temporary, #330)'
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22.22.0
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  RUN_ID: ${{ github.run_id }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  BAKERY_BROWSER_COVERAGE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'affected' }}
jobs:
  probe_ui_architecture:
    name: ui / architecture rules and debt
    runs-on: ubuntu-24.04
    steps:
    - name: Select per-runner handoff directories
      shell: bash
      run: |
        root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
        {
          echo "HANDOFF_ROOT=$root"
          echo "HANDOFF_DIR=$root/$GITHUB_JOB"
          echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
          echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
        } >> "$GITHUB_ENV"
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
      with:
        deno-version: v2.9.1
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: ${{ env.PNPM_VERSION }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
    - name: Test UI architecture rules and debt ratchet
      run: pnpm ui:architecture:test
    - name: Write ui_architecture evidence
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
        CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts ui_architecture "pnpm ui:architecture:test" "UI architecture rules and debt ratchet"
    - name: Emit ui architecture evidence handoff to job log
      if: always()
      env:
        EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
        ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
        SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
      run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log ui_architecture
  probe_docs_validation:
    name: docs / validation
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
      with:
        deno-version: v2.9.1
    - name: Validate documentation XML and metadata
      run: deno run --allow-read --allow-run=python3 scripts/ci/validate-docs.ts
    - name: Test documentation routing classifier
      run: deno test --allow-read --allow-run --allow-env tests/unit/ci-docs-routing_test.ts
  probe_description_policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
      with:
        deno-version: v2.9.1
    - name: Validate live PR and owning issue metadata
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: deno run --no-config --allow-read=scripts/authoring --allow-env=GITHUB_REPOSITORY,GITHUB_TOKEN --allow-net=api.github.com scripts/authoring/github.ts check pr "$PR_NUMBER"
  probe_deno_path:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
      with:
        deno-version: v2.9.1
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: ${{ env.PNPM_VERSION }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Where does the deno node shim directory come from
      shell: bash
      run: |
        set +e
        DENO="$(command -v deno)"
        echo "deno=$DENO node=$(command -v node)  CI=${CI:-unset} GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset} DENO_DIR=${DENO_DIR:-unset}"
        echo "cache dir before: $(ls -d "$HOME/.cache/deno" 2>&1 | head -1)"
        show() { echo "[$1] $2"; }
        P='console.log("   PATH seen =", Deno.env.get("PATH"));'
        show E1 "minimal env, PATH=/usr/bin, cwd=repo"
        env -i HOME="$HOME" PATH=/usr/bin "$DENO" eval "$P" 2>&1 | tail -1
        show E2 "same plus CI=true GITHUB_ACTIONS=true"
        env -i HOME="$HOME" PATH=/usr/bin CI=true GITHUB_ACTIONS=true "$DENO" eval "$P" 2>&1 | tail -1
        show E3 "inherited runner env, only PATH replaced with /usr/bin"
        env PATH=/usr/bin "$DENO" eval "$P" 2>&1 | tail -1
        show E4 "runner env, a deno parent spawns a deno child with env PATH=/usr/bin (like the rail fixture)"
        "$DENO" eval --allow-run 'const o = await new Deno.Command(Deno.execPath(), { args: ["eval", "console.log(Deno.env.get(\"PATH\"))"], env: { PATH: "/usr/bin" }, stdout: "piped" }).output(); console.log("   child PATH =", new TextDecoder().decode(o.stdout).trim());' 2>&1 | tail -1
        show E5 "E4 with clearEnv"
        "$DENO" eval --allow-run 'const o = await new Deno.Command(Deno.execPath(), { args: ["eval", "console.log(Deno.env.get(\"PATH\"))"], env: { PATH: "/usr/bin" }, clearEnv: true, stdout: "piped" }).output(); console.log("   child PATH =", new TextDecoder().decode(o.stdout).trim());' 2>&1 | tail -1
        show E6 "the fixture shape: deno run with --preload of the repo helper, env PATH=/usr/bin"
        printf 'console.log("   PATH seen =", Deno.env.get("PATH"));\n' > "$RUNNER_TEMP/p.ts"
        env PATH=/usr/bin "$DENO" run --allow-env --allow-read --allow-run=git,/usr/bin/git --preload "$GITHUB_WORKSPACE/tests/helpers/temp-cleanup-preload.ts" "$RUNNER_TEMP/p.ts" 2>&1 | tail -2
        show E7 "E6 without the preload"
        env PATH=/usr/bin "$DENO" run --allow-env "$RUNNER_TEMP/p.ts" 2>&1 | tail -1
        echo "cache dir after: $(ls -d "$HOME/.cache/deno/node_compat_bin" 2>&1 | head -1)"
    - name: The failing rail and unit test, verbose
      shell: bash
      run: |
        pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile > /dev/null 2>&1 || true
        deno run --allow-env --allow-read --allow-run scripts/run-tests.ts rails tests/rails/refused-spawn-report_test.ts 2>&1 | tail -60 || true
