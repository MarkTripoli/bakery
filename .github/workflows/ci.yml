name: Bakery CI

# Candidate lanes emit identity-bound bounded evidence archives to ordinary job
# logs. The candidate-side aggregate checks direct results; the external private
# controller, not this workflow, owns authoritative backend status.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: bakery-ci-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  # A newer pull-request or main push supersedes the older run on the same ref; scheduled and manual runs keep their own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 22.22.0
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  RUN_ID: ${{ github.run_id }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  BAKERY_BROWSER_COVERAGE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'affected' }}
  # runner.temp is unavailable in workflow-level env, so every job's first step
  # exports HANDOFF_ROOT/HANDOFF_DIR/EVIDENCE_DIR/ARTIFACT_DIR under its own
  # runner's temp dir; runner users sharing a host never touch each other's files.

jobs:
  changes:
    name: route / changed files
    # Fork PRs never reach self-hosted runners; a maintainer re-pushes them to a branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      route: ${{ steps.classify.outputs.route }}
      lanes: ${{ steps.classify.outputs.lanes }}
      base_sha: ${{ steps.base.outputs.base_sha }}
    runs-on: [self-hosted, hetzner, linux, x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - name: Resolve the comparison base
        id: base
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Routing keeps its guarantee: the classifier below still compares the
          # event head with itself when there is no event base, so a dispatch and
          # the schedule reach `full` rather than a content route. Lanes that
          # need a commit to compare against — the UI architecture contraction
          # ratchet — take one from here, because `github.event.before` is empty
          # on those events and an empty `--base ''` fails the whole route.
          base="$EVENT_BASE"
          if [ -z "$base" ]; then
            base="$(git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH^{commit}" || git merge-base HEAD "origin/$DEFAULT_BRANCH" || true)"
          fi
          if [ -z "$base" ]; then
            echo "cannot resolve a comparison base for $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Classify the complete PR diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno run --allow-env --allow-read --allow-write --allow-run=git scripts/ci/classify-changes.ts
  rails:
    name: fast / backend rails
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.route == 'full' || needs.changes.outputs.route == 'gate' || needs.changes.outputs.route == 'affected') }}
    needs: [changes]
    runs-on: [self-hosted, hetzner, linux, x64]
    steps:
      - name: Select per-runner handoff directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "HANDOFF_ROOT=$root"
            echo "HANDOFF_DIR=$root/$GITHUB_JOB"
            echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: pnpm --dir packages/ui build-storybook
      - run: pnpm test:rails
      - name: Write rails evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts rails "pnpm test:rails" "backend rails"
      - name: Emit rails evidence handoff to job log
        if: always()
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
        run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log rails
  git_diff_check:
    name: fast / git diff check
    # Fork PRs never reach self-hosted runners; a maintainer re-pushes them to a branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hetzner, linux, x64]
    steps:
      - name: Select per-runner handoff directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "HANDOFF_ROOT=$root"
            echo "HANDOFF_DIR=$root/$GITHUB_JOB"
            echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - name: Run git diff check
        run: git diff --check "${{ github.event.pull_request.base.sha || github.sha }}...${{ env.CANDIDATE_SHA }}"
      - name: Write git diff check evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts git_diff_check "git diff --check" "whitespace errors in candidate diff"
      - name: Emit git diff check evidence handoff to job log
        if: always()
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
        run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log git_diff_check
  semantic_metadata:
    name: fast / semantic metadata
    # Fork PRs never reach self-hosted runners; a maintainer re-pushes them to a branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hetzner, linux, x64]
    steps:
      - name: Select per-runner handoff directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "HANDOFF_ROOT=$root"
            echo "HANDOFF_DIR=$root/$GITHUB_JOB"
            echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          deno run --allow-read scripts/ci/validate-semantic.ts --title
          "$PR_TITLE" --pull-request-number "$PR_NUMBER"
      - name: Validate pull request commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: deno run --allow-run scripts/ci/validate-semantic.ts --commit-range "$BASE_SHA" "$CANDIDATE_SHA"
      - name: Validate pushed commit subjects
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: deno run --allow-run scripts/ci/validate-semantic.ts --commit-range "$BASE_SHA" "$CANDIDATE_SHA"
      - name: "TypeSafe advisory: commit subjects"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          deno run --allow-net=api.typesafe.ai
          --allow-env=TYPESAFE_API_KEY,GITHUB_STEP_SUMMARY
          --allow-run=git --allow-read
          --allow-write="$GITHUB_STEP_SUMMARY"
          scripts/ci/annotate-semantic.ts --title "$PR_TITLE" --commit-range
          "$BASE_SHA" "$CANDIDATE_SHA" --pull-request-number "$PR_NUMBER"
      - name: "TypeSafe advisory: migration boundary"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          deno run --allow-net=api.typesafe.ai
          --allow-env=TYPESAFE_API_KEY,GITHUB_STEP_SUMMARY
          --allow-run=git --allow-read
          --allow-write="$GITHUB_STEP_SUMMARY"
          scripts/ci/annotate-migration-boundary.ts --commit-range "$BASE_SHA"
          "$CANDIDATE_SHA"
      - name: Write semantic metadata evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts semantic_metadata "PR title and commit subjects" "semantic metadata"
      - name: Emit semantic metadata evidence handoff to job log
        if: always()
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
        run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log semantic_metadata
  format:
    name: fast / format
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.route == 'full' || needs.changes.outputs.route == 'gate' || needs.changes.outputs.route == 'affected') }}
    needs: [changes]
    runs-on: [self-hosted, hetzner, linux, x64]
    steps:
      - name: Select per-runner handoff directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "HANDOFF_ROOT=$root"
            echo "HANDOFF_DIR=$root/$GITHUB_JOB"
            echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: pnpm lint
      - name: Write format evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts format "pnpm lint" "formatter, linter, and suppression guard"
      - name: Emit format evidence handoff to job log
        if: always()
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
        run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log format
  typecheck:
    name: fast / typecheck
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.route == 'full' || needs.changes.outputs.route == 'gate' || needs.changes.outputs.route == 'affected') }}
    needs: [changes]
    runs-on: [self-hosted, hetzner, linux, x64]
    steps:
      - name: Select per-runner handoff directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "HANDOFF_ROOT=$root"
            echo "HANDOFF_DIR=$root/$GITHUB_JOB"
            echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: pnpm typecheck
      - name: Write typecheck evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts typecheck "pnpm typecheck" "all backend packages"
      - name: Emit typecheck evidence handoff to job log
        if: always()
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
        run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log typecheck
  contract:
    name: fast / contract descriptions
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.route == 'full' || needs.changes.outputs.route == 'gate' || needs.changes.outputs.route == 'affected') }}
    needs: [changes]
    runs-on: [self-hosted, hetzner, linux, x64]
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bakery-ci-postgres
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:20000-20999:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Select per-runner handoff directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "HANDOFF_ROOT=$root"
            echo "HANDOFF_DIR=$root/$GITHUB_JOB"
            echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Ensure psql client
        shell: bash
        run: |
          # The self-hosted runner image does not preinstall the PostgreSQL
          # client that hosted runners ship by default; install it once per
          # job only when missing.
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          }
      - name: Configure PostgreSQL connection
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          {
            echo "BAKERY_POSTGRES_PORT=$POSTGRES_PORT"
            echo "DATABASE_URL=postgres://bakery:bakery-ci-bakery@127.0.0.1:$POSTGRES_PORT/bakery"
            echo "BAKERY_APP_DATABASE_URL=postgres://bakery_app:bakery-ci-app@127.0.0.1:$POSTGRES_PORT/bakery"
          } >> "$GITHUB_ENV"
      - name: Provision contract test roles and database
        env:
          PGPASSWORD: bakery-ci-postgres
        run: |
          psql --host 127.0.0.1 --port "$BAKERY_POSTGRES_PORT" --username postgres --dbname postgres --command "CREATE ROLE bakery LOGIN PASSWORD 'bakery-ci-bakery'"
          psql --host 127.0.0.1 --port "$BAKERY_POSTGRES_PORT" --username postgres --dbname postgres --command "CREATE ROLE bakery_app LOGIN PASSWORD 'bakery-ci-app'"
          psql --host 127.0.0.1 --port "$BAKERY_POSTGRES_PORT" --username postgres --dbname postgres --command "CREATE DATABASE bakery OWNER bakery"
          psql --host 127.0.0.1 --port "$BAKERY_POSTGRES_PORT" --username postgres --dbname postgres --command "GRANT CONNECT ON DATABASE bakery TO bakery_app"
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Select this shard of the contract suite
        id: shard
        run: |
          set -euo pipefail
          files="$(deno run --allow-read scripts/ci/test-shard.ts tests/contract 0 3)"
          test -n "$files"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - run: pnpm test:contract -- ${{ steps.shard.outputs.files }}
      - name: "TypeSafe advisory: contract descriptions"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          deno run --allow-net=api.typesafe.ai
          --allow-env=TYPESAFE_API_KEY,GITHUB_STEP_SUMMARY
          --allow-run=git --allow-read
          --allow-write="$GITHUB_STEP_SUMMARY"
          scripts/ci/annotate-contract-descriptions.ts --commit-range "$BASE_SHA" "$CANDIDATE_SHA"
      - run: >-
          pnpm contracts:generate -- --base-ref "${{ github.event.pull_request.base.sha || github.sha }}"
          ${{ github.event_name == 'pull_request' && '--compatibility-migration docs/technical-design/contract-migrations/v1-unreleased-principal-organization-contracts.json' || '' }}
      - run: git diff --exit-code -- packages/contracts/generated/
      - run: pnpm catalog:literals:check
      - name: Write contract_description_gate evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts contract_description_gate "pnpm test:contract -- shard 0 of 3" "contract schemas, generated client manifest and catalog literals for the first shard of the contract suite, plus generation and catalog literal checks"
      - name: Emit contract description gate evidence handoff to job log
        if: always()
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
        run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log contract_description_gate
  contract_shard_b:
    name: fast / contract descriptions b
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.route == 'full' || needs.changes.outputs.route == 'gate' || needs.changes.outputs.route == 'affected') }}
    needs: [changes]
    runs-on: [self-hosted, hetzner, linux, x64]
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bakery-ci-postgres
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:20000-20999:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
