            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - name: Reject invalid direct lane results
        if: always()
        env:
          ROUTE: "${{ needs.changes.outputs.route }}"
          LANE_DOCS_VALIDATION: "${{ needs.docs_validation.result }}"
          LANE_RAILS: "${{ needs.rails.result }}"
          LANE_GIT_DIFF_CHECK: "${{ needs.git_diff_check.result }}"
          LANE_SEMANTIC_METADATA: "${{ needs.semantic_metadata.result }}"
          LANE_FORMAT: "${{ needs.format.result }}"
          LANE_TYPECHECK: "${{ needs.typecheck.result }}"
          LANE_CONTRACT_DESCRIPTION_GATE: "${{ needs.contract.result }}"
          LANE_CONTRACT_DESCRIPTION_GATE_B: "${{ needs.contract_shard_b.result }}"
          LANE_CONTRACT_DESCRIPTION_GATE_C: "${{ needs.contract_shard_c.result }}"
          LANE_FOCUSED_UNIT_TESTS: "${{ needs.unit.result }}"
          LANE_FOCUSED_UNIT_TESTS_B: "${{ needs.unit_shard_b.result }}"
          LANE_PROVIDER_TESTS: "${{ needs.provider.result }}"
          LANE_UI_CATALOG: "${{ needs.ui_catalog.result }}"
          LANE_UI_QUALITY: "${{ needs.ui_quality.result }}"
          LANE_UI_ARCHITECTURE: "${{ needs.ui_architecture.result }}"
          LANE_UI_STORYBOOK_BROWSER: "${{ needs.ui_storybook_browser.result }}"
          LANE_INTEGRATION_TESTS: "${{ needs.integration.result }}"
          LANE_SECURITY_TESTS: "${{ needs.security.result }}"
          LANE_RECOVERY_TESTS: "${{ needs.recovery.result }}"
          LANE_BROWSER_TESTS: "${{ needs.browser.result }}"
          LANE_UI_WEB_BROWSER: "${{ needs.ui_web.result }}"
          LANE_UI_WEB_BROWSER_B: "${{ needs.ui_web_b.result }}"
          LANE_UI_WEB_BROWSER_C: "${{ needs.ui_web_c.result }}"
          LANE_UI_WEB_BROWSER_D: "${{ needs.ui_web_d.result }}"
          LANE_E2E_TESTS: "${{ needs.e2e.result }}"
          LANE_UI_PAPER_RUNTIME: "${{ needs.ui_paper_runtime.result }}"
          LANE_UI_PAPER_ENTITLEMENTS: "${{ needs.ui_paper_entitlements.result }}"
          LANE_UI_PAPER_ARTIFACTS: "${{ needs.ui_paper_artifacts.result }}"
          LANE_NATIVE_WORKER: "${{ needs.native_worker.result }}"
          AFFECTED_LANES: "${{ needs.changes.outputs.lanes }}"
        run: |
          set -euo pipefail
          if [[ "$ROUTE" == docs ]]; then
            [[ "$LANE_DOCS_VALIDATION" == success ]] || {
              echo "documentation lane did not succeed: $LANE_DOCS_VALIDATION" >&2
              exit 1
            }
            exit 0
          fi
          if [[ "$ROUTE" == gate ]]; then
            for lane_result in \
              "$LANE_RAILS" \
              "$LANE_GIT_DIFF_CHECK" \
              "$LANE_SEMANTIC_METADATA" \
              "$LANE_FORMAT" \
              "$LANE_TYPECHECK" \
              "$LANE_CONTRACT_DESCRIPTION_GATE" \
              "$LANE_CONTRACT_DESCRIPTION_GATE_B" \
              "$LANE_CONTRACT_DESCRIPTION_GATE_C" \
              "$LANE_FOCUSED_UNIT_TESTS" \
              "$LANE_FOCUSED_UNIT_TESTS_B" \
              "$LANE_PROVIDER_TESTS" \
              "$LANE_UI_CATALOG" \
              "$LANE_UI_QUALITY"
            do
              if [[ "$lane_result" != success ]]; then
                echo "gate lane did not succeed: $lane_result" >&2
                exit 1
              fi
            done
            for heavy_lane in \
              "$LANE_UI_ARCHITECTURE" \
              "$LANE_UI_STORYBOOK_BROWSER" \
              "$LANE_INTEGRATION_TESTS" \
              "$LANE_SECURITY_TESTS" \
              "$LANE_RECOVERY_TESTS" \
              "$LANE_BROWSER_TESTS" \
              "$LANE_UI_WEB_BROWSER" \
              "$LANE_UI_WEB_BROWSER_B" \
              "$LANE_UI_WEB_BROWSER_C" \
              "$LANE_UI_WEB_BROWSER_D" \
              "$LANE_E2E_TESTS" \
              "$LANE_UI_PAPER_RUNTIME" \
              "$LANE_UI_PAPER_ENTITLEMENTS" \
              "$LANE_UI_PAPER_ARTIFACTS" \
              "$LANE_NATIVE_WORKER"
            do
              if [[ "$heavy_lane" != skipped ]]; then
                echo "post-merge lane ran on a pull request: $heavy_lane" >&2
                exit 1
              fi
            done
            exit 0
          fi
          if [[ "$ROUTE" == affected ]]; then
            # The fast lanes run on every non-pr route, so they always owe a
            # success here. Each heavy lane only ran when its key was selected
            # in the classifier's lane union (`lanes=<json array>` from the
            # changes job): selected lanes must succeed and unselected lanes
            # must be skipped, mirroring the gate branch's fail-closed checks.
            for lane_result in \
              "$LANE_RAILS" \
              "$LANE_GIT_DIFF_CHECK" \
              "$LANE_SEMANTIC_METADATA" \
              "$LANE_FORMAT" \
              "$LANE_TYPECHECK" \
              "$LANE_CONTRACT_DESCRIPTION_GATE" \
              "$LANE_CONTRACT_DESCRIPTION_GATE_B" \
              "$LANE_CONTRACT_DESCRIPTION_GATE_C" \
              "$LANE_FOCUSED_UNIT_TESTS" \
              "$LANE_FOCUSED_UNIT_TESTS_B" \
              "$LANE_PROVIDER_TESTS" \
              "$LANE_UI_CATALOG" \
              "$LANE_UI_QUALITY"
            do
              if [[ "$lane_result" != success ]]; then
                echo "affected fast lane did not succeed: $lane_result" >&2
                exit 1
              fi
            done
            for lane_key in \
              integration_tests \
              security_tests \
              recovery_tests \
              browser_tests \
              ui_web_browser \
              ui_web_browser_b \
              ui_web_browser_c \
              ui_web_browser_d \
              e2e_tests \
              ui_architecture \
              ui_storybook_browser \
              ui_paper_runtime \
              ui_paper_entitlements \
              ui_paper_artifacts \
              native_worker
            do
              lane_env="LANE_${lane_key^^}"
              lane_result="${!lane_env}"
              if [[ "$AFFECTED_LANES" == *"\"${lane_key}\""* ]]; then
                if [[ "$lane_result" != success ]]; then
                  echo "affected lane did not succeed: ${lane_key} ($lane_result)" >&2
                  exit 1
                fi
              elif [[ "$lane_result" != skipped ]]; then
                echo "unselected lane ran on the affected route: ${lane_key} ($lane_result)" >&2
                exit 1
              fi
            done
            if [[ "$LANE_DOCS_VALIDATION" != skipped ]]; then
              echo "documentation lane ran on the affected route: $LANE_DOCS_VALIDATION" >&2
              exit 1
            fi
            exit 0
          fi
          [[ "$ROUTE" == full ]] || { echo "unknown CI route: $ROUTE" >&2; exit 1; }
          for lane_result in \
            "$LANE_RAILS" \
            "$LANE_GIT_DIFF_CHECK" \
            "$LANE_SEMANTIC_METADATA" \
            "$LANE_FORMAT" \
            "$LANE_TYPECHECK" \
            "$LANE_CONTRACT_DESCRIPTION_GATE" \
            "$LANE_CONTRACT_DESCRIPTION_GATE_B" \
            "$LANE_CONTRACT_DESCRIPTION_GATE_C" \
            "$LANE_FOCUSED_UNIT_TESTS" \
            "$LANE_FOCUSED_UNIT_TESTS_B" \
            "$LANE_PROVIDER_TESTS" \
            "$LANE_UI_CATALOG" \
            "$LANE_UI_QUALITY" \
            "$LANE_UI_ARCHITECTURE" \
            "$LANE_UI_STORYBOOK_BROWSER" \
            "$LANE_INTEGRATION_TESTS" \
            "$LANE_SECURITY_TESTS" \
            "$LANE_RECOVERY_TESTS" \
            "$LANE_BROWSER_TESTS" \
            "$LANE_UI_WEB_BROWSER" \
            "$LANE_UI_WEB_BROWSER_B" \
            "$LANE_UI_WEB_BROWSER_C" \
            "$LANE_UI_WEB_BROWSER_D" \
            "$LANE_E2E_TESTS" \
            "$LANE_UI_PAPER_RUNTIME" \
            "$LANE_UI_PAPER_ENTITLEMENTS" \
            "$LANE_UI_PAPER_ARTIFACTS" \
            "$LANE_NATIVE_WORKER"
          do
            if [[ "$lane_result" != success ]]; then
              echo "required lane did not succeed: $lane_result" >&2
              exit 1
            fi
          done
      # On pull_request, github.workflow_sha is the candidate merge commit. This
      # checkout is only host-local cleanup; it is not trusted policy execution.
      - name: Check out cleanup script
        if: always()
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-policy
          persist-credentials: false
      - name: Cleanup bounded handoff directories
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "$HANDOFF_ROOT"
          find /tmp -xdev -maxdepth 1 -mindepth 1 -type d \
            \( -name 'bakery-ci-*' -o -name 'bakery-connected-native-*' \) \
            -mmin +360 -exec rm -rf -- {} +
          bash trusted-policy/scripts/ci/reap-dangling-volumes.sh
