  ui_paper_runtime:
    name: ui / paper parity runtime
    needs: [changes, ui_catalog, ui_quality, ui_storybook_browser]
    if: ${{ needs.changes.result == 'success' && (needs.changes.outputs.route == 'full' || (needs.changes.outputs.route == 'affected' && contains(fromJSON(needs.changes.outputs.lanes), 'ui_paper_runtime'))) && needs.ui_catalog.result == 'success' && needs.ui_quality.result == 'success' && needs.ui_storybook_browser.result == 'success' }}
    runs-on: [self-hosted, hetzner, amd, linux, x64]
    steps:
      - name: Select per-runner handoff directories
        shell: bash
        run: |
          root="$RUNNER_TEMP/bakery-ci-$RUN_ID-$RUN_ATTEMPT"
          {
            echo "HANDOFF_ROOT=$root"
            echo "HANDOFF_DIR=$root/$GITHUB_JOB"
            echo "EVIDENCE_DIR=$root/$GITHUB_JOB/evidence"
            echo "ARTIFACT_DIR=$root/$GITHUB_JOB/candidate-artifacts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with: { deno-version: v2.9.1 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Pick a free web port
        run: |
          port="$(node scripts/ci/pick-free-port.mjs 2>/dev/null || echo 5173)"
          {
            echo "BAKERY_WEB_PORT=$port"
            echo "BAKERY_PUBLIC_BASE_URL=http://127.0.0.1:$port"
          } >> "$GITHUB_ENV"
      - name: Sweep persistent-runner leftovers
        shell: bash
        run: |
          # Persistent self-hosted-runner hygiene: the checkout does not remove
          # untracked paths, so a crash in a previous run could leave a stale
          # runtime capture that the comparator would treat as fresh input.
          rm -rf artifacts/ui-baseline/runtime artifacts/ui-baseline/paper
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: pnpm --dir packages/ui build-storybook
      - run: pnpm --dir packages/ui exec playwright install chromium
      - name: Pin Paper-lane fontconfig
        # The persistent runner's fontconfig (subpixel antialiasing, system
        # fallback fonts) shifts glyph ink enough to drop fresh renders below
        # the reference floor. FONTCONFIG_FILE replaces host font config for
        # this job's browsers with a repo-owned, grayscale, Geist-only one.
        run: echo "FONTCONFIG_FILE=$(scripts/ci/paper-fontconfig.sh "$RUNNER_TEMP/paper-fontconfig")" >> "$GITHUB_ENV"
      - name: Set the capture base for changed runs
        if: github.event_name == 'pull_request'
        run: echo "BAKERY_CAPTURE_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
      - name: Start web dev server for fixture routes
        # Design route candidates compare against the app's real fixture
        # routes (`/__fixtures__/...`), which only exist under the Vite dev
        # server (`import.meta.env.DEV`) — a production build 404s them, and
        # no API/DB is needed since capture-stories.mjs stubs every request.
        run: |
          pnpm --dir apps/web dev --host 127.0.0.1 --port "$BAKERY_WEB_PORT" > "$RUNNER_TEMP/web-dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web-dev.pid"
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$BAKERY_WEB_PORT/" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$BAKERY_WEB_PORT/" >/dev/null
      - name: Capture owned matrices
        # BAKERY_CAPTURE_JOBS=4 uses the supported context-pool workers; the
        # cap stays at four so the Vite module graph cache stays warm and the
        # dev server keeps up with concurrent page loads.
        env:
          BAKERY_CAPTURE_JOBS: "4"
        run: |
          set -euo pipefail
          mode=${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
          for site in stories; do
            pnpm --dir packages/ui capture:$site -- --$mode --web-base-url "http://127.0.0.1:$BAKERY_WEB_PORT"
          done
      - name: Stop web dev server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/web-dev.pid")" || true
      - name: Complete git history before the provenance gate
        # A persistent runner can carry a leftover .git/shallow entry from the
        # repository's pre-recreation history (bakery-hetzner-4, runs
        # 43023722608 and 43056515091): no ref reaches it and the server does
        # not have it, so `git fetch --unshallow` cannot clear it and the Paper
        # provenance gate refuses the repository as shallow. This drops only
        # entries no ref contains, logs each one, and still fails on a real
        # boundary (learnings/stale-shallow-entry-survives-unshallow.xml).
        # NODE_V8_COVERAGE: Deno's node:child_process reads it on every spawn.
        run: deno run --allow-run=git --allow-read --allow-write=.git --allow-env=RUNNER_NAME,NODE_V8_COVERAGE scripts/ci/heal-stale-shallow.ts
      - name: Compare owned Paper references
        # On a pull request the base SHA lets compare-paper.mjs skip
        # re-rendering references that no changed path produces or pins (the
        # base's own run proved them); a main push always re-renders.
        # Read-only bounded diagnostics in the existing comparison JSON.
        # Does not alter rendering, scoring or trusted archive authority.
        env:
          BAKERY_CAPTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BAKERY_PAPER_RASTER_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          for manifest in auth; do
            if [ "$manifest" = auth ]; then
              pnpm --dir packages/ui compare:paper -- --cycle 1
            else
              pnpm --dir packages/ui compare:paper -- --manifest "$manifest" --cycle 1
            fi
          done
      - name: Summarize failure
        if: failure()
        run: |
          if [ -f artifacts/ui-baseline/runtime/manifest.json ]; then
            jq -c '.cases[] | select(.kind == "route" and (.status != "passed" or .contentBox == null)) | {id, status, reason, observed: .description.observed}' artifacts/ui-baseline/runtime/manifest.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/ui-baseline/paper/comparison.txt ]; then
            grep -vE '^PASSED ' artifacts/ui-baseline/paper/comparison.txt | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          tail -n 40 "$RUNNER_TEMP/web-dev.log" || true
      - name: Write ui_paper_runtime evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: deno run --allow-env --allow-read --allow-write scripts/ci/write-evidence.ts ui_paper_runtime "pnpm --dir packages/ui capture:stories -- --changed|--all --web-base-url http://127.0.0.1:<free-port> && pnpm --dir packages/ui compare:paper -- --cycle 1" "runtime cases with axe, containment, focus, and target-size assertions; trusted verifier independently scores bounded candidate PNGs against reference bytes from the immutable base SHA; producer score fields are checked only for consistency" artifacts/ui-baseline/runtime/manifest.json,artifacts/ui-baseline/paper/comparison.json
      - name: Emit evidence handoff to job log
        if: always()
        env:
          EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
          ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
          SCRATCH_DIR: ${{ env.HANDOFF_DIR }}
        run: deno run --allow-env --allow-read="$HANDOFF_DIR,scripts/ci/release-evidence.ts" --allow-write="$HANDOFF_DIR" --allow-run=zip scripts/ci/release-evidence.ts emit-log ui_paper_runtime
