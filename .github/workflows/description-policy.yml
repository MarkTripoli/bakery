name: Description policy

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

# Serialize validation of each item; every run fetches current metadata.
concurrency:
  group: description-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  issue:
    # Maintainers only: nobody outside the repository's collaborators triggers CI.
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Maintainers only
        id: maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          # The event's author_association reads CONTRIBUTOR for a private
          # organization member, so ask the repository who may write to it. A
          # lookup that fails for any reason but "not a user with access" fails the
          # job, so a broken gate shows red instead of silently skipping.
          err="$RUNNER_TEMP/maintainer.err"
          if level=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>"$err"); then
            :
          elif grep -q 'HTTP 404' "$err"; then
            level=none
          else
            cat "$err" >&2
            exit 1
          fi
          case "$level" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "Skipped: $AUTHOR has $level access." ;;
          esac
      - if: steps.maintainer.outputs.allowed == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: steps.maintainer.outputs.allowed == 'true'
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.1
      - name: Validate live issue metadata
        if: steps.maintainer.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: deno run --no-config --allow-read=scripts/authoring --allow-env=GITHUB_REPOSITORY,GITHUB_TOKEN --allow-net=api.github.com scripts/authoring/github.ts check issue "$ISSUE_NUMBER"

  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # How many verification lines are still open at the PR head: the
    # `verification` job below runs only when it is 0.
    outputs:
      open: ${{ steps.metadata.outputs.open }}
    steps:
      - name: Maintainers only
        id: maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The event's author_association reads CONTRIBUTOR for a private
          # organization member, so ask the repository who may write to it. A
          # lookup that fails for any reason but "not a user with access" fails the
          # job, so a broken gate shows red instead of silently skipping.
          err="$RUNNER_TEMP/maintainer.err"
          if level=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>"$err"); then
            :
          elif grep -q 'HTTP 404' "$err"; then
            level=none
          else
            cat "$err" >&2
            exit 1
          fi
          case "$level" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              # A required check must never read green unvalidated: an outside
              # contributor's PR fails here until a maintainer takes it over.
              echo "::error::outside contributor ($AUTHOR has $level access): a maintainer must take this PR over"
              exit 1
              ;;
          esac
      # github.sha is trusted base code for pull_request_target, never PR head.
      - if: steps.maintainer.outputs.allowed == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: steps.maintainer.outputs.allowed == 'true'
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb
        with:
          deno-version: v2.9.1
      - name: Validate live PR and owning issue metadata
        id: metadata
        if: steps.maintainer.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/description-check.json"
          # Only a format error fails this job. A verification line nobody has
          # ticked at the PR head is not an error: it keeps `verification` skipped.
          deno run --no-config --allow-read=scripts/authoring --allow-env=GITHUB_REPOSITORY,GITHUB_TOKEN --allow-net=api.github.com scripts/authoring/github.ts check pr "$PR_NUMBER" | tee "$result"
          open=$(jq '.pending | length' "$result")
          echo "open=$open" >> "$GITHUB_OUTPUT"
          {
            echo "### Verification: $open open at this head"
            jq -r '.pending[] | "- " + .' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

  # Green only when every sign-off is ticked or N/A at the PR head. While any is
  # open (or after a push moved the head past the ticks) this job is skipped, never
  # red, so an unsigned PR shows grey instead of failing. It writes nothing.
  verification:
    needs: pull-request
    if: github.event_name == 'pull_request_target' && needs.pull-request.result == 'success' && needs.pull-request.outputs.open == '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: echo "Every verification line is ticked or marked N/A at the PR head."
