<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Hermetic font configuration for enterprise Paper reference renders.
  render-paper-references.mjs points FONTCONFIG_FILE here for the enterprise
  manifest only. No system font directory and no include of the host config:
  the only fonts are the committed Geist files, and rasterisation is pinned to
  grayscale antialiasing with slight hinting so a runner's own fontconfig
  (LCD subpixel order, hinting) cannot change the pixels.
-->
<fontconfig>
  <dir prefix="relative">../../../../docs/technical-design/enterprise-mocks/fonts</dir>
  <cachedir prefix="xdg">bakery-fontconfig</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
